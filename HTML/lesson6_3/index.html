<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Instagram</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<div class="w-800">
    <section class="section_login">
        <h1>Instagram</h1>
        <form >
            <input
                    type="text"
                    placeholder="Номер телефону, ім'я користувача або email"
                    required
                    aria-label="Дані користувача"
            >

            <input
                    type="password"
                    placeholder="Пароль"
                    required
                    aria-label="Пароль"
            >
            <button type="submit" class="login-button">
                Увійти
            </button>
        </form>
        <h2>АБО</h2>
        <div class="login_facebook">
            <i class="fa-brands fa-square-facebook"></i>
            <h2>  Увійти через Facebook</h2>
        </div>
        <p class="forgot-password">Забули пароль?</p>
    </section>
    <section class="section_registration">
        <h3> Не маєте облікового запису? <span>Зареєструйтеся</span></h3>
    </section>
</div>
<script src="https://kit.fontawesome.com/ad7917c060.js" crossorigin="anonymous"></script>
</body>
</html>
